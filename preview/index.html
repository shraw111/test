<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Generated code may not call out: no fetch/XHR/WebSocket. Scripts come
         only from this server (React, DS, runtime) or the blob URL of a build. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob: IMPORTMAP_HASH; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src * data:; connect-src 'none'; form-action 'none'"
    />
    <title>Preview</title>
    <!--IMPORTMAP-->
    <!--STYLES-->
    <style id="app-css"></style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/runtime.js"></script>
  </body>
</html>
